name: Run tests


on:
  push:
    branches:
      - "dev"


jobs:
  run_tests:

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        flask-version: ["flask-2.x", "flask-3.x"]
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    name: "🐍 ${{ matrix.python-version }} 🔹 ${{ matrix.flask-version }}"

    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4

      - name: "📦 set up 🐍 ${{ matrix.python-version }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: "📦 install marshmallow-jsonapi"
        run: uv sync --dev

      - name: "📦 install Flask 2.x"
        if: ${{ matrix.flask-version == 'flask-2.x' }}
        run: uv pip install "flask~=2.0"

      - name: "📦 install Flask 3.x"
        if: ${{ matrix.flask-version == 'flask-3.x' }}
        run: uv pip install "flask~=3.0"

      - name: "run tests 🔹 🐍 ${{ matrix.python-version }}"
        run: uv run pytest .
